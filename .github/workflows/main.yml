
name: Build CleanYourTV IPK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No source ZIP found in repository root"
            exit 1
          fi
          mkdir source
          unzip -q "$ZIP" -d source
          PROJECT=$(find source -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ ! -f "$PROJECT/scripts/build.sh" ]; then
            echo "Project build script not found"
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        shell: bash
        run: |
          cd "$PROJECT"
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ziglang==0.14.1
          npm install --prefix build/tools --no-audit --no-fund '@webos-tools/cli@3.2.6'

      - name: Configure build tools
        shell: bash
        run: |
          cd "$PROJECT"
          echo "$PWD/build/tools/node_modules/.bin" >> "$GITHUB_PATH"
          echo "ZIG=$(python -c 'from pathlib import Path; import ziglang; print(Path(ziglang.__file__).parent / "zig")')" >> "$GITHUB_ENV"
          echo "ARES_PACKAGE=$PWD/build/tools/node_modules/.bin/ares-package" >> "$GITHUB_ENV"

      - name: Verify tools
        run: |
          node --version
          python --version
          "$ZIG" version
          ares-package --version

      - name: Build TV packages
        run: |
          cd "$PROJECT"
          bash scripts/build.sh

      - name: Upload IPK packages
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-IPK
          path: |
            source/*/dist/*.ipk
            source/*/dist/SHA256SUMS
          if-no-files-found: error
